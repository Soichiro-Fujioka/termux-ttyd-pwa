name: APT Repository

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.0" >> "$GITHUB_ENV"
          fi

      - name: Build package
        run: packaging/apt/build-deb.sh

      - name: Build repository
        run: packaging/apt/build-repo.sh

      - name: Disable Jekyll
        run: touch dist/apt-repo/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apt-repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
