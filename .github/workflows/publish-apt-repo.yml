name: Publish APT repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - bin/**
      - public/**
      - packaging/apt/**
      - .github/workflows/publish-apt-repo.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY"
          install -m 700 -d ~/.gnupg
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build Debian package
        run: packaging/apt/build-deb.sh

      - name: Build signed APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: packaging/apt/build-repo.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload APT repository artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
