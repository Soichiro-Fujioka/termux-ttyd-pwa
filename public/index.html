<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Termux ttyd PWA</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="terminal-shell">
      <iframe id="terminalFrame" class="terminal-frame" title="ttyd terminal" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
    </main>

    <div id="edgeSwipeZone" class="edge-swipe-zone" aria-hidden="true"></div>
    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="controlDrawer" class="control-drawer" aria-label="Controls" aria-hidden="true">
      <div class="drawer-grip" aria-hidden="true"></div>
      <button id="settingsToggle" class="drawer-action" type="button" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
      <button id="fullscreenToggle" class="drawer-action" type="button" aria-pressed="false">Fullscreen</button>

      <section id="settingsPanel" class="settings-panel" hidden>
        <form id="settingsForm" class="settings-form">
          <label>
            ttyd URL
            <input id="ttydUrl" name="ttydUrl" type="url" inputmode="url" autocomplete="off">
          </label>
          <label>
            Terminal padding
            <input id="terminalPadding" name="terminalPadding" type="text" inputmode="text" autocomplete="off" placeholder="0 or 12px">
          </label>
          <label>
            Font style
            <select id="fontStyle" name="fontStyle">
              <option value="termux">Termux font</option>
              <option value="android">Android system font</option>
            </select>
          </label>
          <p class="settings-note">Font style is set at startup. Termux font copy uses <code>~/.termux/font.ttf</code> or <code>TERMUX_FONT_FILE</code> and takes priority over Android font settings.</p>
          <div class="settings-actions">
            <button class="button primary" type="submit">Apply</button>
            <button id="reloadTerminal" class="button" type="button">Reload</button>
          </div>
        </form>
      </section>
    </aside>

    <script src="/config.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
